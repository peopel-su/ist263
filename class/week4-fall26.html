<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Title</title>
</head>

<body>
    <h1>Tables</h1>
    <table>
        <caption>Our First Table</caption>
        <tr>
            <th>Column One</th>
            <th>Column Two</th>
            <th>Column Three</th>
        </tr>
        <tr>
            <td>Freshmen</td>
            <td>Sophomore</td>
            <td>Junior</td>
        </tr>

    </table>

    <h1>Forms</h1>
    <form action="" method="">
        <label for="fname">First name: </label>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last name: </label>
        <input type="text" id="lname" name="lname"><br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments">

        </textarea><br><br>

        <p>Pick a number</p>

        <input type="radio" id="number1" name="numbers" value="1">
        <label for="number1">1</label>
        <input type="radio" id="number2" name="numbers" value="2">
        <label for="number2">2</label><br><br>

        <input type="checkbox" id="veh1" name="veh1" value="Bike">
        <label for="veh1">I have a bike</label>
        <input type="checkbox" id="veh2" name="veh2" value="Car">
        <label for="veh2">I have a car</label><br><br>

        <label for="cars">Select a Car</label>
        <select id="cars" name="cars">
            <option value="BMW">BMW</option>
            <option value="Ford">Ford</option>
        </select><br><br>

        <input type="submit" value="Submit This Form">

    </form>

</body>

</html>
